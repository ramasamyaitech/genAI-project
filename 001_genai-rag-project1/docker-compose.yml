version: "3.9"

services:

  ollama:

    image: ollama/ollama

    container_name: ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama:/root/.ollama

  postgres:

    image: postgres:16

    container_name: postgres

    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpassword

    ports:
      - "5432:5432"

    volumes:
      - postgres:/var/lib/postgresql/data

  redis:

    image: redis:7

    container_name: redis

    ports:
      - "6379:6379"

  rag:

    build: .

    container_name: rag

    depends_on:
      - postgres
      - redis
      - ollama

    ports:
      - "8000:8000"

    env_file:
      - .env

volumes:

  postgres:

  ollama: